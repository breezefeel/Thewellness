<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>힐링트리 콘텐츠 플래너</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans KR', sans-serif; background: #F8F7F4; color: #1A1A1A; min-height: 100vh; }

/* ── Top bar ── */
.topbar {
background: #1A1A1A;
padding: 14px 20px;
display: flex; align-items: center; justify-content: space-between;
position: sticky; top: 0; z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.logo-icon { font-size: 20px; }
.logo-text { color: #fff; font-weight: 700; font-size: 15px; letter-spacing: -.3px; }
.logo-sub { color: #9CA3AF; font-size: 11px; margin-top: 1px; }
.topbar-right { display: flex; gap: 8px; align-items: center; }
.api-badge {
font-size: 11px; padding: 5px 10px; border-radius: 6px;
border: 1px solid #3A3A3A; color: #9CA3AF; background: none;
cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px;
}
.api-badge:hover { border-color: #2DD4BF; color: #2DD4BF; }
.api-dot { width: 6px; height: 6px; border-radius: 50%; background: #EF4444; }
.api-dot.on { background: #2DD4BF; }
.btn-add {
background: #2DD4BF; color: #1A1A1A; border: none; border-radius: 6px;
padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
font-family: inherit;
}

/* ── Category tabs ── */
.cat-tabs-wrap {
background: #1A1A1A;
border-top: 1px solid #2A2A2A;
overflow-x: auto;
-webkit-overflow-scrolling: touch;
}
.cat-tabs-wrap::-webkit-scrollbar { display: none; }
.cat-tabs {
display: flex; padding: 0 12px; gap: 4px; min-width: max-content;
}
.cat-tab {
padding: 10px 14px; border: none; background: none;
color: #6B6B6B; font-size: 12px; font-weight: 600;
cursor: pointer; font-family: inherit; white-space: nowrap;
border-bottom: 2px solid transparent;
transition: all 0.15s; display: flex; align-items: center; gap: 5px;
}
.cat-tab:hover { color: #D0D0D0; }
.cat-tab.active { color: #2DD4BF; border-bottom-color: #2DD4BF; }

/* ── Alert banner ── */
.alert-banner {
margin: 14px 16px 0;
background: linear-gradient(135deg, #2DD4BF, #0EA5E9);
border-radius: 12px; padding: 14px 16px;
display: flex; align-items: center; justify-content: space-between;
cursor: pointer;
}
.alert-banner-text { color: #fff; }
.alert-banner-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.alert-banner-topic { font-size: 14px; font-weight: 600; }
.alert-banner-meta { font-size: 11px; opacity: 0.75; margin-top: 2px; }
.alert-banner-arrow { color: #fff; font-size: 20px; }

/* ── Stats row ── */
.stats-row { display: flex; gap: 8px; padding: 14px 16px 0; }
.stat-card {
flex: 1; background: #fff; border-radius: 10px; padding: 10px 8px;
text-align: center; cursor: pointer;
border: 2px solid #E5E7EB; transition: all 0.15s;
}
.stat-card.active { border-color: var(--sc, #6B7280); }
.stat-num { font-size: 18px; font-weight: 800; color: var(--sc, #6B7280); }
.stat-label { font-size: 10px; color: #9CA3AF; margin-top: 1px; }

/* ── Search ── */
.search-wrap { padding: 12px 16px 0; }
.search-input {
width: 100%; padding: 10px 14px; border-radius: 10px;
border: 1.5px solid #E5E7EB; font-size: 13px; outline: none;
background: #fff; font-family: inherit;
}
.search-input:focus { border-color: #2DD4BF; }

/* ── Cards ── */
.cards-wrap { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

/* Recommended section */
.rec-section-title {
font-size: 12px; font-weight: 700; color: #9CA3AF;
letter-spacing: .5px; padding: 4px 0 8px;
display: flex; align-items: center; gap: 6px;
}
.rec-divider { height: 1px; background: #E5E7EB; margin: 6px 0 14px; }

.draft-card {
background: #fff; border-radius: 12px; padding: 14px 16px;
cursor: pointer; border: 1.5px solid #E5E7EB;
transition: all 0.15s; position: relative; overflow: hidden;
}
.draft-card::before {
content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
background: var(--cc, #2DD4BF);
}
.draft-card:hover { border-color: var(--cc, #2DD4BF); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.draft-card.published { opacity: 0.55; }
.draft-card.recommended { border-color: #F59E0B; }
.draft-card.recommended::before { background: #F59E0B; }

.card-badges { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
.badge {
font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 700;
}
.badge-aud { background: rgba(45,212,191,0.12); color: #0F766E; }
.badge-rec { background: #FEF3C7; color: #D97706; }
.badge-pub { background: #F3F4F6; color: #9CA3AF; }
.badge-gen { background: #DBEAFE; color: #2563EB; }

.card-topic { font-weight: 700; font-size: 14px; color: #1A1A1A; margin-bottom: 5px; line-height: 1.45; }
.card-angle { font-size: 12px; color: #9CA3AF; line-height: 1.55; }
.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.card-date { font-size: 11px; color: #C0C0C0; }
.card-arrow { font-size: 15px; color: #C0C0C0; transition: transform 0.15s; }
.draft-card:hover .card-arrow { transform: translateX(3px); color: #1A1A1A; }

/* ── Detail overlay ── */
.detail-overlay {
display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
z-index: 200; backdrop-filter: blur(4px);
}
.detail-overlay.open { display: block; }
.detail-sheet {
position: fixed; bottom: 0; left: 0; right: 0;
background: #fff; border-radius: 20px 20px 0 0;
max-height: 90vh; display: flex; flex-direction: column;
transform: translateY(100%); transition: transform 0.3s;
z-index: 201;
}
.detail-sheet.open { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; background: #E5E7EB; border-radius: 2px; margin: 12px auto 0; }
.sheet-header {
padding: 14px 20px 12px; border-bottom: 1px solid #F3F4F6;
display: flex; align-items: flex-start; gap: 12px;
}
.sheet-close {
background: #F3F4F6; border: none; border-radius: 8px;
width: 30px; height: 30px; font-size: 14px; cursor: pointer;
flex-shrink: 0; margin-top: 2px;
}
.sheet-title { font-weight: 700; font-size: 14px; line-height: 1.45; flex: 1; }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
.sheet-actions {
padding: 12px 20px 24px; border-top: 1px solid #F3F4F6;
display: flex; gap: 8px;
}

/* Tabs inside sheet */
.sheet-tabs-scroll {
overflow-x: auto; -webkit-overflow-scrolling: touch;
margin-bottom: 16px; min-width: 0; scrollbar-width: thin;
}
.sheet-tabs-scroll .sheet-tabs {
display: flex; gap: 4px; background: #F3F4F6; border-radius: 10px;
padding: 4px; width: max-content; min-width: 100%; box-sizing: border-box;
}
.sheet-tabs-scroll .sheet-tab {
flex: 1 1 auto; padding: 8px 10px; border: none; background: none;
border-radius: 7px; font-size: 11px; font-weight: 700;
cursor: pointer; color: #9CA3AF; font-family: inherit; transition: all .15s;
white-space: nowrap; min-width: max-content;
}
.sheet-tabs-scroll .sheet-tab.active { background: #fff; color: #1A1A1A; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

/* Image tab */
.img-section-title {
font-size: 11px; font-weight: 800; color: #9CA3AF;
letter-spacing: .06em; text-transform: uppercase;
margin: 18px 0 10px;
}
.img-section-title:first-child { margin-top: 0; }
.img-stock-grid { display: flex; flex-direction: column; gap: 12px; }
.img-stock-card {
background: #fff; border: 1.5px solid #E5E7EB; border-radius: 12px;
overflow: hidden;
}
.img-stock-thumb-wrap {
position: relative; background: linear-gradient(135deg,#EEF2FF,#ECFDF5);
aspect-ratio: 400 / 240; max-height: 200px;
}
.img-stock-thumb {
width: 100%; height: 100%; object-fit: cover; display: block;
}
.img-stock-fallback .img-stock-thumb { display: none; }
.img-stock-thumb-placeholder {
display: none; align-items: center; justify-content: center;
min-height: 120px; color: #9CA3AF; font-size: 12px; text-align: center; padding: 16px; line-height: 1.5;
}
.img-stock-fallback .img-stock-thumb-placeholder { display: flex; }
.img-stock-meta { padding: 12px 14px; }
.img-stock-label { font-size: 13px; font-weight: 700; color: #1A1A1A; margin-bottom: 6px; line-height: 1.45; }
.img-stock-query { font-size: 11px; color: #6B7280; margin-bottom: 10px; word-break: break-all; }
.img-stock-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.img-mini-btn {
flex: 1; min-width: 108px;
padding: 8px 10px; border-radius: 8px; border: 1px solid #E5E7EB;
background: #F9FAFB; font-size: 11px; font-weight: 700; cursor: pointer;
font-family: inherit; color: #374151;
}
.img-mini-btn:hover { border-color: #2DD4BF; color: #0F766E; }
.img-tool-card {
background: #F8F7F4; border-radius: 12px; padding: 14px 14px 12px;
margin-bottom: 10px; border: 1px solid #E5E7EB;
}
.img-tool-title { font-size: 13px; font-weight: 800; color: #1A1A1A; margin-bottom: 6px; }
.img-tool-preview {
font-size: 12px; color: #6B7280; line-height: 1.55; margin-bottom: 12px;
max-height: 88px; overflow: hidden; position: relative;
}
.img-tool-preview::after {
content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
background: linear-gradient(transparent, #F8F7F4);
}
.img-tool-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.img-tool-main-btn {
flex: 1; min-width: 140px;
padding: 11px 14px; border-radius: 10px; border: none;
font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit;
color: #fff;
}
.img-tool-main-btn.gpt { background: linear-gradient(135deg, #10A37F, #1a7f64); }
.img-tool-main-btn.canva { background: linear-gradient(135deg, #00C4CC, #7D2AE8); }
.img-tool-copy-btn {
padding: 10px 14px; border-radius: 10px; border: 1px solid #E5E7EB;
background: #fff; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.img-tool-hint {
font-size: 11px; color: #92400E; line-height: 1.55; margin-top: 14px; padding: 10px 12px;
background: #FFFBEB; border-radius: 8px; border: 1px solid #FDE68A;
}

/* Content blocks */
.cb { margin-bottom: 14px; }
.cb-label {
font-size: 10px; font-weight: 700; color: #9CA3AF; letter-spacing: .8px;
text-transform: uppercase; margin-bottom: 6px;
display: flex; align-items: center; justify-content: space-between;
}
.copy-btn {
font-size: 10px; font-weight: 700; color: #9CA3AF; background: none;
border: 1px solid #E5E7EB; border-radius: 4px; padding: 2px 8px; cursor: pointer;
font-family: inherit; transition: all .15s;
}
.copy-btn:hover { border-color: #2DD4BF; color: #2DD4BF; }
.copy-btn.copied { border-color: #16A34A; color: #16A34A; }
.cb-box {
background: #F8F7F4; border-radius: 10px; padding: 12px 14px;
font-size: 13px; line-height: 1.75; color: #374151; white-space: pre-wrap;
}
.cb-title { font-size: 15px; font-weight: 700; color: #1A1A1A; }
.outline-item {
padding: 7px 0; border-bottom: 1px solid #F3F4F6;
font-size: 13px; color: #374151; display: flex; gap: 8px;
}
.outline-item:last-child { border-bottom: none; }
.outline-num { color: #2DD4BF; font-weight: 800; min-width: 18px; }
.carousel-item {
background: #F8F7F4; border-radius: 8px; padding: 10px 12px;
margin-bottom: 6px; display: flex; gap: 10px;
}
.slide-badge {
background: #F59E0B; color: #fff; border-radius: 4px;
padding: 1px 7px; font-size: 10px; font-weight: 800; height: fit-content; margin-top: 2px;
}
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: #F3F4F6; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #6B7280; }

/* Action buttons */
.btn-gen-big {
flex: 1; background: linear-gradient(135deg, #2DD4BF, #0EA5E9);
color: #fff; border: none; border-radius: 12px; padding: 13px;
font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit;
}
.btn-gen-big:disabled { opacity: .5; cursor: not-allowed; }
.btn-pub {
background: #16A34A; color: #fff; border: none; border-radius: 12px;
padding: 13px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-regen {
background: #F3F4F6; color: #6B7280; border: none; border-radius: 12px;
padding: 13px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-regen:hover { background: #E5E7EB; }

/* Loading */
.loading-wrap { text-align: center; padding: 40px 20px; }
.spinner { width: 36px; height: 36px; border: 3px solid #E5E7EB; border-top-color: #2DD4BF; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: #9CA3AF; line-height: 1.7; }

/* API Modal */
.modal-overlay {
display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
z-index: 300; align-items: center; justify-content: center;
backdrop-filter: blur(6px);
}
.modal-overlay.open { display: flex; }
.modal-box {
background: #fff; border-radius: 20px; padding: 32px 28px;
max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal-logo { font-size: 28px; margin-bottom: 10px; }
.modal-title { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
.modal-desc { font-size: 13px; color: #6B7280; line-height: 1.7; margin-bottom: 20px; }
.modal-input {
width: 100%; padding: 12px 14px; border-radius: 10px;
border: 1.5px solid #E5E7EB; font-size: 13px; outline: none;
font-family: monospace; margin-bottom: 8px;
}
.modal-input:focus { border-color: #2DD4BF; }
.modal-hint { font-size: 11px; color: #9CA3AF; margin-bottom: 16px; }
.modal-hint a { color: #2DD4BF; text-decoration: none; }
.modal-btn {
width: 100%; background: #1A1A1A; color: #fff; border: none;
border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 800;
cursor: pointer; font-family: inherit;
}

/* Add form */
.add-form { background: #fff; border-radius: 16px; padding: 20px; margin: 14px 16px; border: 1.5px solid #E5E7EB; }
.form-title { font-weight: 800; font-size: 16px; margin-bottom: 18px; }
.form-field { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 700; color: #6B7280; margin-bottom: 6px; display: block; }
.form-input, .form-select {
width: 100%; padding: 10px 14px; border-radius: 10px;
border: 1.5px solid #E5E7EB; font-size: 14px; outline: none;
font-family: inherit; background: #fff;
}
.form-input:focus, .form-select:focus { border-color: #2DD4BF; }
.aud-row { display: flex; gap: 8px; }
.aud-btn {
flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #E5E7EB;
background: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
font-family: inherit; color: #6B7280; transition: all .15s;
}
.aud-btn.active { border-color: #2DD4BF; background: #F0FDFA; color: #0F766E; }
.btn-submit {
width: 100%; background: #1A1A1A; color: #fff; border: none;
border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 800;
cursor: pointer; font-family: inherit; margin-top: 6px;
}
.empty-note { text-align: center; padding: 40px 20px; color: #C0C0C0; font-size: 13px; }

/* ── Prompt editor modal ── */
.prompt-modal-overlay {
display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
z-index: 300; align-items: flex-end; justify-content: center;
backdrop-filter: blur(4px);
}
.prompt-modal-overlay.open { display: flex; }
.prompt-modal {
background: #fff; border-radius: 20px 20px 0 0;
width: 100%; max-width: 600px; max-height: 92vh;
display: flex; flex-direction: column;
min-width: 0;
transform: translateY(100%); transition: transform 0.3s;
}
.prompt-modal.open { transform: translateY(0); }
.prompt-modal-handle { width: 40px; height: 4px; background: #E5E7EB; border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
.prompt-modal-header {
padding: 14px 20px 12px; border-bottom: 1px solid #F3F4F6;
display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.prompt-modal-title {
font-weight: 800; font-size: 15px; flex: 1; min-width: 0;
overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.prompt-modal-close {
background: #F3F4F6; border: none; border-radius: 8px;
width: 30px; height: 30px; font-size: 14px; cursor: pointer;
}
.prompt-modal-body {
flex: 1; min-width: 0; overflow-y: auto;
padding: 16px 20px;
}
.prompt-modal-body > .prompt-tabs-scroll {
overflow-x: auto; -webkit-overflow-scrolling: touch;
scrollbar-width: thin;
margin-bottom: 16px;
min-width: 0;
}
.prompt-tabs-scroll .prompt-tabs {
display: flex; gap: 4px; background: #F3F4F6; border-radius: 10px;
padding: 4px; margin-bottom: 0;
flex-wrap: nowrap;
width: max-content;
min-width: 100%;
box-sizing: border-box;
}
.prompt-tabs-scroll .prompt-tab {
flex: 1 1 auto; padding: 8px 12px; border: none; background: none;
border-radius: 7px; font-size: 12px; font-weight: 700;
cursor: pointer; color: #9CA3AF; font-family: inherit; transition: all .15s;
white-space: nowrap; min-width: max-content;
}
.prompt-tab.active { background: #fff; color: #1A1A1A; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.prompt-section { margin-bottom: 18px; }
.prompt-modal-cat-scroll {
overflow-x: auto; -webkit-overflow-scrolling: touch;
margin: -16px -20px 14px;
min-width: 0;
scrollbar-width: thin;
}
.prompt-modal-cat-scroll .cat-tabs-wrap {
overflow-x: visible;
}
.prompt-section-label {
font-size: 11px; font-weight: 700; color: #6B7280; margin-bottom: 6px;
display: flex; align-items: center; justify-content: space-between;
flex-wrap: wrap; gap: 6px 10px;
}
.prompt-reset-btn {
flex-shrink: 0; font-size: 10px; color: #9CA3AF; background: none; border: 1px solid #E5E7EB;
border-radius: 4px; padding: 2px 7px; cursor: pointer; font-family: inherit;
}
.prompt-reset-btn:hover { border-color: #EF4444; color: #EF4444; }
.prompt-textarea {
width: 100%; min-height: 140px; padding: 12px 14px;
border: 1.5px solid #E5E7EB; border-radius: 10px;
font-size: 12px; line-height: 1.7; font-family: inherit;
resize: vertical; outline: none; color: #374151; background: #FAFAFA;
}
.prompt-textarea:focus { border-color: #2DD4BF; background: #fff; }
.prompt-hint {
font-size: 11px; color: #9CA3AF; margin-top: 5px; line-height: 1.6;
}
.prompt-modal-footer {
padding: 12px 20px 28px; border-top: 1px solid #F3F4F6;
display: flex; gap: 8px; flex-shrink: 0;
}
.btn-save-prompt {
flex: 1; background: #1A1A1A; color: #fff; border: none;
border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 800;
cursor: pointer; font-family: inherit;
}
.btn-cancel-prompt {
background: #F3F4F6; color: #6B7280; border: none; border-radius: 12px;
padding: 13px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
}

/* 프롬프트 설정 버튼 (topbar) */
.btn-prompt-settings {
background: none; color: #9CA3AF; border: 1px solid #3A3A3A;
border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
font-family: inherit; transition: all .15s;
}
.btn-prompt-settings:hover { border-color: #F59E0B; color: #F59E0B; }

@media (min-width: 640px) {
.detail-sheet { max-width: 480px; left: 50%; right: auto; transform: translateX(-50%) translateY(100%); border-radius: 20px; bottom: 20px; }
.detail-sheet.open { transform: translateX(-50%) translateY(0); }
.prompt-modal { border-radius: 20px; max-width: 560px; bottom: 20px; }
}
</style>

</head>
<body>

<!-- API Modal -->

<div class="modal-overlay open" id="api-modal">
  <div class="modal-box">
    <div class="modal-logo">🌿</div>
    <div class="modal-title">힐링트리 콘텐츠 플래너</div>
    <div class="modal-desc">Anthropic API 키를 입력하면 Claude AI가 블로그 & 인스타 초안을 자동으로 만들어드려요. 키는 브라우저에만 저장돼요.</div>
    <input class="modal-input" type="text" id="api-input" placeholder="API 키를 붙여넣으세요" />
    <div id="api-error" style="font-size:12px;color:#EF4444;min-height:18px;margin-bottom:8px;"></div>

function saveKey() {

  document.getElementById('api-modal').classList.remove('open');
  updateApiBadge();
  renderMain();
}

  document.getElementById('api-input').value = state.apiKey;

  document.getElementById('api-dot').className = 'api-dot' + (state.apiKey ? ' on' : '');

  const wrap = document.getElementById('cat-tabs');
  wrap.innerHTML = CATEGORIES.map((c,i) => `
    <button class="cat-tab${state.currentCat===i?' active':''}" onclick="selectCat(${i})">
      ${c.icon} ${c.name}
    </button>`).join('');
}

function selectCat(i) {
  state.currentCat = i;
  state.filterStatus = '전체';
  state.searchQ = '';
  state.showAdd = false;
  renderTabs();
  renderMain();
}

// ── Recommendations ──
function getRecommended(catId) {
  const cat = CATEGORIES[catId];
  const pubIds = Object.keys(state.published).filter(id => id.startsWith('d'+catId+'-') && state.published[id].date);
  const unpub = cat.drafts.filter(d => !pubIds.includes(d.id));
  if(pubIds.length === 0) return [];
  const related = unpub.slice(0,3).map(d => ({...d, recType:'related'}));
  const trending = [];
  for(const oc of CATEGORIES){
    if(oc.id===catId || oc.audience!==cat.audience) continue;
    const u = oc.drafts.find(d => !state.published[d.id]?.date);
    if(u) trending.push({...u, recType:'trending', fromCat:oc.name});
    if(trending.length>=2) break;
  }
  return [...related, ...trending];
}

  const total = cat.drafts.length;
  const pubCount = cat.drafts.filter(d=>state.published[d.id]?.date).length;
  const genCount = cat.drafts.filter(d=>state.generatedOnly[d.id] || state.published[d.id]?.content).length;
  const statsHTML = `
    <div class="stats-row">
      <div class="stat-card${state.filterStatus==='전체'?' active':''}" style="--sc:#6B7280" onclick="setFilter('전체')">
        <div class="stat-num">${total}</div><div class="stat-label">전체</div>
      </div>
      <div class="stat-card${state.filterStatus==='초안있음'?' active':''}" style="--sc:#2563EB" onclick="setFilter('초안있음')">
        <div class="stat-num">${genCount}</div><div class="stat-label">초안있음</div>
      </div>
      <div class="stat-card${state.filterStatus==='발행완료'?' active':''}" style="--sc:#16A34A" onclick="setFilter('발행완료')">
        <div class="stat-num">${pubCount}</div><div class="stat-label">발행완료</div>
      </div>
    </div>`;

  // Search
  const searchHTML = `
    <div class="search-wrap">
      <input class="search-input" value="${state.searchQ}" oninput="setSearch(this.value)" placeholder="주제 검색..." />
    </div>`;

  // Recommended
  const recs = getRecommended(state.currentCat);
  let recHTML = '';
  if(recs.length > 0 && state.filterStatus==='전체' && !state.searchQ){
    recHTML = `<div class="rec-section-title">⭐ 이번에 추천하는 초안 <span style="font-weight:400;font-size:10px;color:#C0C0C0">관련 3개 + 호응예상 2개</span></div>` +
      recs.map(d => draftCardHTML(d, cat, true)).join('') +
      `<div class="rec-divider"></div><div class="rec-section-title" style="margin-bottom:4px;">전체 초안</div>`;
  }

  // Draft cards
  let drafts = cat.drafts;
  if(state.filterStatus==='초안있음') drafts = drafts.filter(d=>state.generatedOnly[d.id]||state.published[d.id]?.content);
  if(state.filterStatus==='발행완료') drafts = drafts.filter(d=>state.published[d.id]?.date);
  if(state.searchQ) drafts = drafts.filter(d=>d.topic.includes(state.searchQ)||d.angle.includes(state.searchQ));
  const cardsHTML = drafts.length ? drafts.map(d=>draftCardHTML(d,cat,false)).join('') : '<div class="empty-note">조건에 맞는 초안이 없어요</div>';

  mc.innerHTML = alertHTML + statsHTML + searchHTML + `<div class="cards-wrap">${recHTML}${cardsHTML}</div>`;
}

function draftCardHTML(d, cat, isRec) {
  const pub = state.published[d.id];
  const hasContent = pub?.content || state.generatedOnly[d.id];
  const isPub = !!pub?.date;
  const color = isRec && d.recType==='trending' ? '#F59E0B' : cat.color;
  const badges = [
    `<span class="badge badge-aud">${cat.audience}</span>`,
    isRec && d.recType==='related' ? '<span class="badge badge-rec">🔗 관련</span>' : '',
    isRec && d.recType==='trending' ? `<span class="badge badge-rec">⭐ ${d.fromCat}</span>` : '',
    hasContent ? '<span class="badge badge-gen">📝 초안있음</span>' : '',
    isPub ? '<span class="badge badge-pub">✓ 발행완료</span>' : '',
  ].filter(Boolean).join('');
  return `<div class="draft-card${isPub?' published':''}${isRec?' recommended':''}" style="--cc:${color}" onclick="openDetail('${d.id}',${cat.id})">
    <div class="card-badges">${badges}</div>
    <div class="card-topic">${d.topic}</div>
    <div class="card-angle">${d.angle}</div>
    <div class="card-footer">
      <div class="card-date">${isPub?'발행: '+pub.date:'미발행'}</div>
      <div class="card-arrow">→</div>
    </div>
  </div>`;
}

function setFilter(f){ state.filterStatus=f; renderMain(); }
function setSearch(v){ state.searchQ=v; renderMain(); }

function toggleAdd(){
  state.showAdd = !state.showAdd;

}

    <div class="form-field">
      <label class="form-label">카테고리</label>
      <select class="form-select" onchange="setNewCat(this.value)">${catOpts}</select>

    </div>
    <div class="form-field">

function setNewCat(v){ state.newItem.catId=parseInt(v); renderMain(); }
function setAud(v){ state.newItem.audience=v; renderMain(); }
function addDraft(){
  if(!state.newItem.topic.trim()){ alert('주제를 입력해주세요'); return; }
  const cat = CATEGORIES[state.newItem.catId];
  const id = 'd'+state.newItem.catId+'-c'+Date.now();
  cat.drafts.push({ id, topic: state.newItem.topic, angle: state.newItem.audience+'을 위한 콘텐츠' });
  state.newItem = { date:'', topic:'', catId: state.newItem.catId, audience:'일반인' };

  document.getElementById('add-toggle-btn').textContent = '+ 추가';
  state.currentCat = cat.id;
  renderTabs(); renderMain();

// ── Detail sheet ──
function openDetail(draftId, catId) {
  const cat = CATEGORIES[catId];
  const draft = cat.drafts.find(d=>d.id===draftId);
  if(!draft) return;
  state.selectedId = draftId;
  state.selectedCatId = catId;
  state.activeTab = 'blog';
  document.getElementById('sheet-title').textContent = draft.topic;
  const pub = state.published[draftId];
  const content = pub?.content || state.generatedOnly[draftId];
  if(content){ renderSheetContent(content); }
  else { renderSheetEmpty(draft, cat); }
  document.getElementById('detail-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('detail-sheet').classList.add('open'), 10);
}

      ${cb('제목', `<div class="cb-box cb-title">${b.title}</div>`, b.title)}
      ${cb('후킹 오프닝', `<div class="cb-box">${b.hook}</div>`, b.hook)}

        ${b.outline.map((o,i)=>`<div class="outline-item"><span class="outline-num">${i+1}.</span>${o}</div>`).join('')}

      ${cb('캡션', `<div class="cb-box">${ig.caption}</div>`, ig.hook+'\n\n'+ig.caption)}
      <div class="cb"><div class="cb-label">캐러셀 슬라이드</div>
        ${ig.carousel.map(c=>`<div class="carousel-item"><span class="slide-badge">S${c.slide}</span><div><strong style="font-size:13px;color:#1A1A1A;display:block;margin-bottom:3px;">${c.title}</strong><span style="font-size:12px;color:#6B7280;">${c.content}</span></div></div>`).join('')}
      </div>
      <div class="cb"><div class="cb-label">해시태그 <button class="copy-btn" onclick="cp(this,'${ig.hashtags.map(h=>'#'+h).join(' ')}')">전체복사</button></div>

    <button class="btn-regen" onclick="genContent()">🔄 재생성</button>
    <button class="btn-gen-big" onclick="cp(this, getFullCopy())" style="background:#F3F4F6;color:#374151;flex:1;">📋 전체복사</button>
    ${!isPub ? `<button class="btn-pub" onclick="markPub()">✅ 발행완료</button>` : '<span style="font-size:12px;color:#16A34A;font-weight:700;padding:0 4px;">✓ 발행됨</span>'}`;

window.getFullCopy = function(){
  const content = state.published[state.selectedId]?.content || state.generatedOnly[state.selectedId];
  if(!content) return '';
  const b = content.blog;
  let t = `[블로그]\n제목: ${b.title}\n\n${b.hook}\n\n${b.draft}\n\n${b.cta}\n\n${b.hashtags.map(h=>'#'+h).join(' ')}`;
  const ig = content.insta;
  if(ig){
    t += `\n\n[인스타]\n${ig.hook}\n\n${ig.caption}\n\n${ig.hashtags.map(h=>'#'+h).join(' ')}`;
  }
  const im = content.images;
  if(im){
    t += '\n\n[이미지 검색 키워드]';
    (im.stockQueries || []).forEach(function(x, i){
      if(x && (x.searchQuery || x.query)){ t += '\n' + (i + 1) + '. ' + (x.label || '') + ' — ' + (x.searchQuery || x.query); }
    });
    t += '\n\n[ChatGPT 이미지 프롬프트]';
    (im.gptVisuals || []).forEach(function(x, i){
      if(x && x.prompt){ t += '\n' + (i + 1) + '. ' + (x.title || '') + '\n' + x.prompt; }
    });
    t += '\n\n[Canva 프롬프트]';
    (im.canvaVisuals || []).forEach(function(x, i){
      if(x && x.prompt){ t += '\n' + (i + 1) + '. ' + (x.title || '') + '\n' + x.prompt; }
    });
  }
  return t;
};

function cb(label, innerHTML, copyText){
  return `<div class="cb"><div class="cb-label">${label} <button class="copy-btn" onclick="cp(this,\`${esc(copyText)}\`)">복사</button></div>${innerHTML}</div>`;
}
function esc(s){ if(!s) return ''; return s.replace(/`/g,"'").replace(/\\/g,'\\\\').replace(/\n/g,'\\n'); }
function escapeHtml(s){
  if(s==null || s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function seedFromString(str){
  let h = 2166136261;
  const s = String(str || '');
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return 's' + (h >>> 0).toString(16);
}

function buildSheetTabsHTML(tab){
  return `<div class="sheet-tabs-scroll"><div class="sheet-tabs">
    <button type="button" class="sheet-tab${tab==='blog'?' active':''}" onclick="switchTab('blog')">📝 블로그</button>
    <button type="button" class="sheet-tab${tab==='insta'?' active':''}" onclick="switchTab('insta')">📱 인스타</button>
    <button type="button" class="sheet-tab${tab==='images'?' active':''}" onclick="switchTab('images')">🖼 이미지</button>
  </div></div>`;
}

function normalizeImagesBlock(raw){
  if(!raw || typeof raw !== 'object') return null;
  return {
    stockQueries: Array.isArray(raw.stockQueries) ? raw.stockQueries : [],
    gptVisuals: Array.isArray(raw.gptVisuals) ? raw.gptVisuals : [],
    canvaVisuals: Array.isArray(raw.canvaVisuals) ? raw.canvaVisuals : [],
  };
}

function buildImageTabBody(content){
  const im = content.images;
  if(!im){
    return `<p class="empty-note" style="padding:0;">이 초안에는 이미지 추천이 없어요. 초안을 다시 생성하면 함께 만들어져요.</p>
      <button type="button" class="btn-gen-big" onclick="genContent()" style="width:100%;margin-top:12px;">🔄 초안·이미지 다시 생성</button>`;
  }
  const stock = (im.stockQueries || []).filter(function(s){ return s && (s.searchQuery || s.query); }).slice(0, 3);
  const gpt = (im.gptVisuals || []).filter(function(s){ return s && s.prompt; }).slice(0, 2);
  const canva = (im.canvaVisuals || []).filter(function(s){ return s && s.prompt; }).slice(0, 2);

  let html = '';

  html += '<div class="img-section-title">① 주제에 맞는 이미지 검색 (3가지)</div>';
  if(stock.length === 0){
    html += '<p class="empty-note" style="padding:12px 0;">검색 키워드가 없습니다. 재생성해 주세요.</p>';
  } else {
    html += '<div class="img-stock-grid">';
    stock.forEach(function(item, i){
      const q = item.searchQuery || item.query || '';
      const label = item.label || ('추천 ' + (i + 1));
      const seed = seedFromString(q + '|' + i);
      const imgUrl = 'https://picsum.photos/seed/' + encodeURIComponent(seed) + '/400/240';
      const dq = encodeURIComponent(q);
      html += '<div class="img-stock-card">';
      html += '<div class="img-stock-thumb-wrap">';
      html += '<img class="img-stock-thumb" src="' + imgUrl + '" alt="" loading="lazy" onerror="this.onerror=null;this.closest(\'.img-stock-card\').classList.add(\'img-stock-fallback\')"/>';
      html += '<div class="img-stock-thumb-placeholder">미리보기를 불러올 수 없을 때는<br>아래 버튼으로 검색해서 확인하세요.</div>';
      html += '</div><div class="img-stock-meta">';
      html += '<div class="img-stock-label">' + escapeHtml(label) + '</div>';
      html += '<div class="img-stock-query">' + escapeHtml(q) + '</div>';
      html += '<div class="img-stock-btns">';
      html += '<button type="button" class="img-mini-btn" data-q="' + dq + '" onclick="openStockSearchFromBtn(\'google\',this)">🔎 Google 이미지</button>';
      html += '<button type="button" class="img-mini-btn" data-q="' + dq + '" onclick="openStockSearchFromBtn(\'unsplash\',this)">🔎 Unsplash</button>';
      html += '</div></div></div>';
    });
    html += '</div>';
    html += '<p style="font-size:11px;color:#9CA3AF;margin-top:8px;line-height:1.5;">미리보기는 예시 이미지예요. 검색 버튼으로 주제에 맞는 실제 사진을 찾아보세요.</p>';
  }

  html += '<div class="img-section-title">② ChatGPT로 그림 (2가지 프롬프트)</div>';
  if(gpt.length === 0){
    html += '<p class="empty-note" style="padding:12px 0;">프롬프트가 없습니다. 재생성해 주세요.</p>';
  } else {
    gpt.forEach(function(item, i){
      const title = item.title || ('시안 ' + (i + 1));
      const p = item.prompt || '';
      const dp = encodeURIComponent(p);
      html += '<div class="img-tool-card">';
      html += '<div class="img-tool-title">' + escapeHtml(title) + '</div>';
      html += '<div class="img-tool-preview">' + escapeHtml(p) + '</div>';
      html += '<div class="img-tool-actions">';
      html += '<button type="button" class="img-tool-main-btn gpt" data-p="' + dp + '" onclick="copyOpenImageTool(\'gpt\',this)">ChatGPT 열기 · 프롬프트 복사</button>';
      html += '<button type="button" class="img-tool-copy-btn" data-p="' + dp + '" onclick="copyPromptOnly(this)">복사만</button>';
      html += '</div></div>';
    });
  }

  html += '<div class="img-section-title">③ Canva로 그림 (2가지 프롬프트)</div>';
  if(canva.length === 0){
    html += '<p class="empty-note" style="padding:12px 0;">프롬프트가 없습니다. 재생성해 주세요.</p>';
  } else {
    canva.forEach(function(item, i){
      const title = item.title || ('시안 ' + (i + 1));
      const p = item.prompt || '';
      const dp = encodeURIComponent(p);
      html += '<div class="img-tool-card">';
      html += '<div class="img-tool-title">' + escapeHtml(title) + '</div>';
      html += '<div class="img-tool-preview">' + escapeHtml(p) + '</div>';
      html += '<div class="img-tool-actions">';
      html += '<button type="button" class="img-tool-main-btn canva" data-p="' + dp + '" onclick="copyOpenImageTool(\'canva\',this)">Canva 열기 · 프롬프트 복사</button>';
      html += '<button type="button" class="img-tool-copy-btn" data-p="' + dp + '" onclick="copyPromptOnly(this)">복사만</button>';
      html += '</div></div>';
    });
  }

  html += '<div class="img-tool-hint">웹 브라우저는 보안상 다른 사이트 입력창에 자동으로 글을 넣을 수 없어요. 버튼을 누르면 <strong>프롬프트가 클립보드에 복사</strong>된 뒤 ChatGPT 또는 Canva가 열립니다. 채팅·디자인 입력란에 <strong>Ctrl+V</strong>로 붙여넣기 하세요.</div>';

  return html;
}

window.openStockSearchFromBtn = function(engine, btn){
  var q = decodeURIComponent(btn.getAttribute('data-q') || '');
  if(!q) return;
  var url = engine === 'google'
    ? 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q)
    : 'https://unsplash.com/s/photos/' + encodeURIComponent(q);
  window.open(url, '_blank', 'noopener,noreferrer');
};

window.copyOpenImageTool = function(kind, btn){
  var raw = btn.getAttribute('data-p');
  var prompt = raw ? decodeURIComponent(raw) : '';
  if(!prompt) return;
  var url = kind === 'gpt' ? 'https://chatgpt.com/' : 'https://www.canva.com/create/';
  var label = btn.textContent;
  navigator.clipboard.writeText(prompt).then(function(){
    window.open(url, '_blank', 'noopener,noreferrer');
    btn.textContent = '✓ 복사 후 이동함';
    setTimeout(function(){ btn.textContent = label; }, 2200);
  }).catch(function(){
    window.open(url, '_blank', 'noopener,noreferrer');
    window.prompt('프롬프트를 복사해 주세요 (Ctrl+C 후 확인):', prompt);
  });
};

window.copyPromptOnly = function(btn){
  var raw = btn.getAttribute('data-p');
  var prompt = raw ? decodeURIComponent(raw) : '';
  if(!prompt) return;
  var label = btn.textContent;
  navigator.clipboard.writeText(prompt).then(function(){
    btn.textContent = '✓ 복사됨';
    setTimeout(function(){ btn.textContent = label; }, 1500);
  }).catch(function(){
    window.prompt('복사할 프롬프트:', prompt);
  });
};

window.cp = function(btn, text){
  navigator.clipboard.writeText(text.replace(/\\n/g,'\n'));
  btn.textContent='✓ 복사됨'; btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent='복사'; btn.classList.remove('copied'); }, 1500);
};
window.switchTab = function(t){ state.activeTab=t; const content=state.published[state.selectedId]?.content||state.generatedOnly[state.selectedId]; if(content) renderSheetContent(content); };

function closeSheet(){
  document.getElementById('detail-sheet').classList.remove('open');
  setTimeout(()=>{ document.getElementById('detail-overlay').classList.remove('open'); }, 280);
}
function closeDetail(e){ if(e.target===document.getElementById('detail-overlay')) closeSheet(); }

function markPub(){
  const today = new Date().toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});
  if(!state.published[state.selectedId]) state.published[state.selectedId]={};
  state.published[state.selectedId].date = today;
  save(); closeSheet(); renderMain();
}

// ── Prompt Modal ──
function getPrompts() {
  return state.prompts || JSON.parse(JSON.stringify(DEFAULT_PROMPTS));
}
function getCatPrompt(catId, type) {
  return getPrompts().categories[catId]?.[type] || DEFAULT_PROMPTS.categories[catId]?.[type] || '';
}
function getBasePrompt() {
  return getPrompts().base || DEFAULT_PROMPTS.base;
}

function openPromptModal(catId) {
  state.editingCatId = catId !== undefined ? catId : state.currentCat;
  state.promptTab = 'blog';
  renderPromptModal();
  document.getElementById('prompt-modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('prompt-modal').classList.add('open'), 10);
}

function renderPromptModal() {
  const cat = CATEGORIES[state.editingCatId];
  document.getElementById('prompt-modal-title').textContent = `⚙️ ${cat.icon} ${cat.name} 프롬프트`;

  const catTabs = CATEGORIES.map((c,i)=>`
    <button class="cat-tab${state.editingCatId===i?' active':''}" onclick="switchPromptCat(${i})" style="color:${state.editingCatId===i?c.color:'#6B6B6B'};border-bottom-color:${state.editingCatId===i?c.color:'transparent'};font-size:11px;padding:8px 10px;">
      ${c.icon} ${c.name}
    </button>`).join('');

  const blogVal = getCatPrompt(state.editingCatId, 'blog');
  const instaVal = getCatPrompt(state.editingCatId, 'insta');
  const baseVal = getBasePrompt();
  const pt = state.promptTab;

  document.getElementById('prompt-modal-body').innerHTML = `
    <div class="prompt-modal-cat-scroll">
      <div class="cat-tabs-wrap" style="background:#F8F7F4;border-top:none;border-bottom:1px solid #E5E7EB;">
        <div class="cat-tabs" style="padding:0 8px;">${catTabs}</div>
      </div>
    </div>

    <div class="prompt-tabs-scroll">
      <div class="prompt-tabs">
        <button class="prompt-tab${pt==='blog'?' active':''}" onclick="switchPromptTab('blog')">📝 블로그</button>
        <button class="prompt-tab${pt==='insta'?' active':''}" onclick="switchPromptTab('insta')">📱 인스타</button>
        <button class="prompt-tab${pt==='base'?' active':''}" onclick="switchPromptTab('base')">🧩 공통 기본</button>
      </div>
    </div>

    ${pt==='blog' ? `
    <div class="prompt-section">
      <div class="prompt-section-label">
        블로그 작성 지침
        <button class="prompt-reset-btn" onclick="resetPrompt('blog')">기본값으로</button>
      </div>
      <textarea class="prompt-textarea" id="pt-blog" placeholder="블로그 글쓰기 스타일, 톤, 구조, 주의사항 등을 자유롭게 입력하세요...">${blogVal}</textarea>
      <div class="prompt-hint">💡 예: "네이버 SEO를 고려해 제목을 작성하세요. 전문 용어는 최소화하고..." — 이 지침이 Claude에게 전달돼 글쓰기 방향을 잡아요.</div>
    </div>` : ''}

${pt==='insta' ? `
<div class="prompt-section">
  <div class="prompt-section-label">
    인스타 작성 지침
    <button class="prompt-reset-btn" onclick="resetPrompt('insta')">기본값으로</button>
  </div>
  <textarea class="prompt-textarea" id="pt-insta" placeholder="인스타 캡션 스타일, 캐러셀 구성 방식, 해시태그 전략 등을 입력하세요...">${instaVal}</textarea>
  <div class="prompt-hint">💡 예: "첫 줄에서 멈추게 만드는 짧은 질문을 써주세요. 캐러셀은 문제→원인→해결 순으로..."</div>
</div>` : ''}

${pt==='base' ? `
<div class="prompt-section">
  <div class="prompt-section-label">
    공통 기본 설정 (모든 카테고리에 적용)
    <button class="prompt-reset-btn" onclick="resetPrompt('base')">기본값으로</button>
  </div>
  <textarea class="prompt-textarea" id="pt-base" style="min-height:180px;" placeholder="원장님 소개, 채널 정보, 전반적인 톤앤매너 등...">${baseVal}</textarea>
  <div class="prompt-hint">💡 원장님 프로필, 운영 채널, 브랜드 톤 등 모든 초안 생성에 공통으로 쓰이는 기본 정보예요.</div>
</div>` : ''}
`;
}

window.switchPromptCat = function(i) {
// 현재 편집 내용 임시 저장
autoSaveCurrentEdit();
state.editingCatId = i;
renderPromptModal();
};
window.switchPromptTab = function(t) {
autoSaveCurrentEdit();
state.promptTab = t;
renderPromptModal();
};

function autoSaveCurrentEdit() {
if(!state.prompts) state.prompts = JSON.parse(JSON.stringify(DEFAULT_PROMPTS));
if(!state.prompts.categories[state.editingCatId]) state.prompts.categories[state.editingCatId] = {};
const blogEl = document.getElementById('pt-blog');
const instaEl = document.getElementById('pt-insta');
const baseEl = document.getElementById('pt-base');
if(blogEl) state.prompts.categories[state.editingCatId].blog = blogEl.value;
if(instaEl) state.prompts.categories[state.editingCatId].insta = instaEl.value;
if(baseEl) state.prompts.base = baseEl.value;
}

window.resetPrompt = function(type) {
if(!confirm('이 항목을 기본값으로 되돌릴까요?')) return;
if(!state.prompts) state.prompts = JSON.parse(JSON.stringify(DEFAULT_PROMPTS));
if(type==='base') { state.prompts.base = DEFAULT_PROMPTS.base; }
else {
if(!state.prompts.categories[state.editingCatId]) state.prompts.categories[state.editingCatId]={};
state.prompts.categories[state.editingCatId][type] = DEFAULT_PROMPTS.categories[state.editingCatId][type];
}
renderPromptModal();
};

function savePrompts() {
autoSaveCurrentEdit();
save();
closePromptModal();
// 저장 완료 피드백
const btn = document.querySelector('.btn-save-prompt');
if(btn){ btn.textContent='✓ 저장됨'; setTimeout(()=>{ btn.textContent='저장하기'; },1200); }
}

function closePromptModal(e) {
if(e && e.target !== document.getElementById('prompt-modal-overlay')) return;
document.getElementById('prompt-modal').classList.remove('open');
setTimeout(()=>document.getElementById('prompt-modal-overlay').classList.remove('open'), 280);
}

// ── Generate ──

try {
const res = await fetch('https://api.anthropic.com/v1/messages', {
method: 'POST',
headers: {
  'Content-Type': 'application/json',
  'x-api-key': state.apiKey,
  'anthropic-version': '2023-06-01',
  'anthropic-dangerous-direct-browser-access': 'true'
},
body: JSON.stringify({
  model: 'claude-sonnet-4-20250514',
  max_tokens: 8192,
  messages: [{ role: 'user', content: prompt }]
})
});
const data = await res.json();
if(!res.ok) throw new Error((data.error && data.error.message) ? data.error.message : ('HTTP ' + res.status));
if(data.error) throw new Error(data.error.message);
const text = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('');
let raw = text.replace(/^```json\s*/i, '').replace(/```\s*$/g, '').trim();
const content = JSON.parse(raw);
content.images = normalizeImagesBlock(content.images);

if(!state.published[state.selectedId]) state.published[state.selectedId]={};
state.published[state.selectedId].content = content;
state.generatedOnly[state.selectedId] = content;
save();
state.activeTab = 'blog';
renderSheetContent(content);
renderMain();
} catch(e) {
document.getElementById('sheet-body').innerHTML = `<div class="loading-wrap" style="color:#EF4444;font-size:13px;">오류: ${String(e.message)}<br><br><button onclick="genContent()" style="background:#F3F4F6;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-family:inherit;font-size:13px;margin-top:8px;">다시 시도</button></div>`;
}
};
